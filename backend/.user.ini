; CloudComAI media upload requirements.
; Hosts that support per-directory PHP configuration (including many shared PHP/FPM deployments)
; will apply these values to the backend. If the production host disables .user.ini,
; apply the same values in the PHP/FPM or hosting control panel configuration.
upload_max_filesize = 25M
post_max_size = 32M
max_execution_time = 120
max_input_time = 120
