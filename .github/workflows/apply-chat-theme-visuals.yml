name: Apply mobile chat theme visuals

on:
  push:
    branches:
      - feat/mobile-chat-themes

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch App.js
        run: python .github/scripts/apply-chat-theme-visuals.py
      - name: Remove temporary patch tooling
        run: rm -f .github/scripts/apply-chat-theme-visuals.py .github/workflows/apply-chat-theme-visuals.yml
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/mobile/App.js .github/scripts/apply-chat-theme-visuals.py .github/workflows/apply-chat-theme-visuals.yml
          git diff --cached --quiet || git commit -m 'feat(mobile): apply custom accent and wallpaper'
          git push
