name: Revert PR 169 through 173

on:
  pull_request:
    types: [opened]
    branches: [main]

permissions:
  contents: write

jobs:
  revert:
    if: github.event.pull_request.head.ref == 'revert/pr169-pr173' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout revert branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: revert/pr169-pr173

      - name: Revert PR 169 through PR 173
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git revert --no-edit -m 1 55e6e1bacf775f8b7dac5437058c03d424f2bd87
          git revert --no-edit -m 1 d6e0375a532cd70dbffaa94c9ab1b3fd39b73186
          git revert --no-edit -m 1 b45e044fa6afc94ea81a42bf30d9b943f4c160c5
          git revert --no-edit -m 1 7e37671baf4b926232e3c47ad7b6f388b71a2126
          git revert --no-edit -m 1 cb4b9b9895177c265ddf5597c23723ff9da08945
          rm -f .github/workflows/revert-pr169-pr173.yml
          git add -A
          git commit -m 'chore: remove temporary PR revert workflow'
          git push origin HEAD:revert/pr169-pr173
