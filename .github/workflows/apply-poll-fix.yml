name: Apply poll navigation and delete fix

on:
  push:
    branches:
      - fix/mobile-poll-back-delete

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply poll fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/mobile/src/components/MobileMenu.js')
          text = path.read_text()
          text = text.replace("  themeSettings,\n}) {", "  themeSettings,\n  onPollBack,\n}) {", 1)
          old_poll_header = "if (screen === 'poll') return (<><ScreenHeader theme={theme} title=\"Create poll\" onBack={() => go('menu')} onClose={onClose} />"
          new_poll_header = "if (screen === 'poll') return (<><ScreenHeader theme={theme} title=\"Create poll\" onClose={onClose} />"
          if old_poll_header not in text:
              raise SystemExit('Poll header pattern not found')
          text = text.replace(old_poll_header, new_poll_header, 1)
          old_request_close = "<Modal visible={visible} animationType=\"slide\" onRequestClose={screen === 'menu' ? onClose : () => go('menu')}>"
          new_request_close = "<Modal visible={visible} animationType=\"slide\" onRequestClose={screen === 'poll' ? (onPollBack || onClose) : screen === 'menu' ? onClose : () => go('menu')}>"
          if old_request_close not in text:
              raise SystemExit('MobileMenu modal back pattern not found')
          text = text.replace(old_request_close, new_request_close, 1)
          path.write_text(text)

          path = Path('apps/mobile/src/components/MediaMessage.js')
          text = path.read_text()
          old_actions = "{showActions && canEdit ? <View style={[styles.messageActions, { backgroundColor: colors.surface || colors.composer || '#fff', borderColor: colors.border || '#dfe4ee' }]}><MessageAction type=\"edit\" label=\"Edit\" color={colors.iconPrimary || colors.accent || '#1677c8'} colors={colors} accessibilityLabel=\"Edit poll\" onPress={onEditPoll} /><MessageAction type=\"delete\" label=\"Delete\" color={colors.error || '#dc2626'} colors={colors} accessibilityLabel=\"Delete poll\" onPress={onDelete} /></View> : null}"
          new_actions = "{showActions ? <View style={[styles.messageActions, { backgroundColor: colors.surface || colors.composer || '#fff', borderColor: colors.border || '#dfe4ee' }]}>{canEdit ? <MessageAction type=\"edit\" label=\"Edit\" color={colors.iconPrimary || colors.accent || '#1677c8'} colors={colors} accessibilityLabel=\"Edit poll\" onPress={onEditPoll} /> : null}<MessageAction type=\"delete\" label=\"Delete\" color={colors.error || '#dc2626'} colors={colors} accessibilityLabel=\"Delete poll\" onPress={onDelete} /></View> : null}"
          if old_actions not in text:
              raise SystemExit('Poll action menu pattern not found')
          text = text.replace(old_actions, new_actions, 1)
          path.write_text(text)

          path = Path('apps/mobile/App.js')
          text = path.read_text()
          old_menu = "initialScreen=\"poll\"\n        initialPollChatId={chat.id}\n        user={user}\n        onClose={() => setPollMenuVisible(false)}"
          new_menu = "initialScreen=\"poll\"\n        initialPollChatId={chat.id}\n        user={user}\n        onPollBack={() => setPollMenuVisible(false)}\n        onClose={() => setPollMenuVisible(false)}"
          if old_menu not in text:
              raise SystemExit('ChatDetail poll MobileMenu pattern not found')
          text = text.replace(old_menu, new_menu, 1)
          path.write_text(text)
          PY

      - name: Add regression coverage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/mobile/test/poll-edit.test.js')
          text = path.read_text()
          additions = r'''

test('poll page has contextual hardware-back behavior and keeps delete after edit eligibility ends', () => {
  assert.match(mobileMenu, /onPollBack/);
  assert.match(mobileMenu, /title=\"Create poll\" onClose=\{onClose\}/);
  assert.match(mobileMenu, /screen === 'poll' \? \(onPollBack \|\| onClose\)/);
  assert.match(app, /onPollBack=\{\(\) => setPollMenuVisible\(false\)\}/);
  assert.match(media, /\{showActions \? <View/);
  assert.match(media, /\{canEdit \? <MessageAction type=\"edit\" label=\"Edit\"/);
  assert.match(media, /<MessageAction type=\"delete\" label=\"Delete\"/);
});
'''
          if additions.strip() not in text:
              text += additions
          path.write_text(text)
          PY

      - name: Run poll regression tests
        run: node --test apps/mobile/test/poll-edit.test.js

      - name: Commit implementation and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/apply-poll-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/App.js apps/mobile/src/components/MobileMenu.js apps/mobile/src/components/MediaMessage.js apps/mobile/test/poll-edit.test.js .github/workflows/apply-poll-fix.yml
          git diff --cached --check
          git commit -m "fix(mobile): handle poll back navigation and delete eligibility"
          git push origin HEAD:${GITHUB_REF_NAME}
