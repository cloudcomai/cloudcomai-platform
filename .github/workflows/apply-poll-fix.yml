name: Apply poll navigation and delete fix

on:
  push:
    branches:
      - fix/mobile-poll-back-delete

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "poll patch workflow started"
      - run: python -c "from pathlib import Path; print(Path('apps/mobile/src/components/MobileMenu.js').exists())"
