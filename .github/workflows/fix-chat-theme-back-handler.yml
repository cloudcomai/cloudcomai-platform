name: Fix chat theme back navigation
on:
  push:
    branches:
      - feat/mobile-chat-themes
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.x' }
      - run: python .github/scripts/fix-chat-theme-back-handler.py
      - run: rm -f .github/scripts/fix-chat-theme-back-handler.py .github/workflows/fix-chat-theme-back-handler.yml
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/mobile/App.js .github/scripts/fix-chat-theme-back-handler.py .github/workflows/fix-chat-theme-back-handler.yml
          git diff --cached --quiet || git commit -m 'fix(mobile): close chat theme settings with Android back'
          git push
