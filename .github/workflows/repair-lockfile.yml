name: Repair lockfile

on:
  push:
    branches:
      - fix/mobile-chat-media-controls-approval
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-chat-media-controls-approval
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Regenerate lockfile
        run: pnpm install --lockfile-only --ignore-scripts
      - name: Commit lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(deps): update pnpm lockfile for expo-contacts"
          git push origin HEAD:fix/mobile-chat-media-controls-approval
      - name: Trigger validation after lockfile update
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run validate.yml --repo "${{ github.repository }}" --ref fix/mobile-chat-media-controls-approval
