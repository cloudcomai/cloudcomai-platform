name: Build Android without EAS

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Preview installs separately; release uses your existing signing key
        type: choice
        default: preview
        options: [preview, release]
      version_code:
        description: Required for release; use a number higher than the last published Android build
        type: string
        default: '1'
permissions:
  contents: read

concurrency:
  group: android-gradle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.variant == 'release' && 'production' || 'preview' }}
    env:
      BUILD_VARIANT: ${{ github.event_name == 'workflow_dispatch' && inputs.variant || 'preview' }}
      ANDROID_VERSION_CODE: ${{ inputs.version_code || '1' }}
      EXPO_PUBLIC_API_BASE_URL: ${{ vars.EXPO_PUBLIC_API_BASE_URL || 'https://example.invalid/apiapp/api' }}
      ENABLE_GOOGLE_DRIVE_ARTIFACT_UPLOAD: ${{ vars.ENABLE_GOOGLE_DRIVE_ARTIFACT_UPLOAD || 'false' }}
      GOOGLE_DRIVE_ARTIFACT_FOLDER_ID: ${{ vars.GOOGLE_DRIVE_ARTIFACT_FOLDER_ID || '1Qs0iWqJbn-2D46S0ef6ddaMFQgHqmY1u' }}
      RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: pnpm install --frozen-lockfile
      - name: Prepare release signing and Firebase configuration
        if: env.BUILD_VARIANT == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != 'refs/heads/main' ]; then
            echo '::error::Release builds must run from main.'
            exit 1
          fi
          if [ "$EXPO_PUBLIC_API_BASE_URL" = 'https://example.invalid/apiapp/api' ]; then
            echo '::error::Configure EXPO_PUBLIC_API_BASE_URL for release builds.'
            exit 1
          fi
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo '::error::Configure ANDROID_KEYSTORE_BASE64 and ANDROID_GOOGLE_SERVICES_JSON for release builds.'
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/cloudcomai-release.jks"
          printf '%s' "$GOOGLE_SERVICES_JSON" > "$RUNNER_TEMP/google-services.json"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/cloudcomai-release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_GOOGLE_SERVICES_FILE=$RUNNER_TEMP/google-services.json" >> "$GITHUB_ENV"
      - name: Compile Android using Gradle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ github.event_name == 'workflow_dispatch' && inputs.variant == 'release' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ github.event_name == 'workflow_dispatch' && inputs.variant == 'release' && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ github.event_name == 'workflow_dispatch' && inputs.variant == 'release' && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: node apps/mobile/scripts/build-android.mjs "$BUILD_VARIANT"
      - name: Save APK and optional AAB
        uses: actions/upload-artifact@v4
        with:
          name: CloudComAI-Android-${{ env.BUILD_VARIANT }}-${{ github.run_number }}
          path: |
            apps/mobile/android/app/build/outputs/apk/release/*.apk
            apps/mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
      - name: Upload Android build to Google Drive
        if: vars.ENABLE_GOOGLE_DRIVE_ARTIFACT_UPLOAD == 'true'
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${RCLONE_CONFIG:-}" ]; then
            echo "::error::Missing GitHub secret RCLONE_CONFIG."
            exit 1
          fi

          if [ -z "${GOOGLE_DRIVE_ARTIFACT_FOLDER_ID:-}" ]; then
            echo "::error::Missing Google Drive artifact folder ID."
            exit 1
          fi

          sudo apt-get update -y
          sudo apt-get install -y rclone

          mkdir -p "$HOME/.config/rclone"
          printf '%s' "$RCLONE_CONFIG" > "$HOME/.config/rclone/rclone.conf"
          chmod 600 "$HOME/.config/rclone/rclone.conf"

          if ! rclone listremotes | grep -qx 'gdrive:'; then
            echo "::error::RCLONE_CONFIG must define a Google Drive remote named gdrive."
            exit 1
          fi

          mkdir -p mobile-builds/android
          find apps/mobile/android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -exec cp {} mobile-builds/android/ \;
          find apps/mobile/android/app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' -exec cp {} mobile-builds/android/ \; 2>/dev/null || true

          if ! find mobile-builds/android -maxdepth 1 -type f | grep -q .; then
            echo "::error::No Android APK/AAB artifacts found for Google Drive upload."
            exit 1
          fi

          DRIVE_PATH="${BUILD_VARIANT}/run-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}/android"
          DRIVE_TARGET="gdrive:"
          if [ -n "${GOOGLE_DRIVE_ARTIFACT_FOLDER_ID:-}" ]; then
            DRIVE_TARGET="gdrive,root_folder_id=${GOOGLE_DRIVE_ARTIFACT_FOLDER_ID}:"
          fi

          echo "Uploading Android build artifacts to Google Drive folder: ${DRIVE_PATH}"
          rclone copy mobile-builds/android/ "${DRIVE_TARGET}${DRIVE_PATH}" --checksum --progress
          rclone lsf "${DRIVE_TARGET}${DRIVE_PATH}"

      - name: Remove temporary signing files
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/cloudcomai-release.jks" "$RUNNER_TEMP/google-services.json"
