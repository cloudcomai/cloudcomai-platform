name: Validate monorepo

on:
  pull_request:
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build:web

  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: find backend -name '*.php' -type f -print0 | xargs -0 -n1 php -l
