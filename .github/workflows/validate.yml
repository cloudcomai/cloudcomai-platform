name: Validate monorepo

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  storage-access:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y apache2
      - run: python3 backend/tests/storage_access_test.py

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply screenshot protection change
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/mobile/App.js')
          text = path.read_text()
          old = '''  useEffect(() => {
    // Android 13 and older require broad gallery access for detection; do not request it solely for this feature.
    if (Platform.OS !== 'ios' && !(Platform.OS === 'android' && Number(Platform.Version) >= 34)) return undefined;
    let lastCapture = 0;
    const subscription = ScreenCapture.addScreenshotListener(async () => {
      if (AppState.currentState !== 'active' || chat.blocked || Date.now() - lastCapture < 10000) return;
      lastCapture = Date.now();
      try {
        const { data } = await platformApi.reportScreenshot(chat.id);
        Alert.alert('Screenshot detected', data.notified_users ? 'Chat participants with screenshot alerts enabled have been notified.' : 'Screenshot detected in this conversation.');
      } catch { Alert.alert('Screenshot detected', 'Unable to notify participants.'); }
    });
    return () => subscription.remove();
  }, [chat.id, chat.blocked]);'''
          new = '''  useEffect(() => {
    // Protect the conversation before the user can capture it. The native module blocks
    // screenshots/screen recordings while this chat is mounted; the listener remains
    // enabled where the platform exposes screenshot events so participants are notified.
    const protectionKey = `chat-${chat.id}`;
    let lastCapture = 0;
    let subscription;

    ScreenCapture.preventScreenCaptureAsync(protectionKey).catch(() => {});

    if (Platform.OS === 'ios' || (Platform.OS === 'android' && Number(Platform.Version) >= 34)) {
      subscription = ScreenCapture.addScreenshotListener(async () => {
        if (AppState.currentState !== 'active' || chat.blocked || Date.now() - lastCapture < 10000) return;
        lastCapture = Date.now();
        try {
          const { data } = await platformApi.reportScreenshot(chat.id);
          Alert.alert('Screenshot blocked', data.notified_users ? 'Screenshots are blocked in this chat. Chat participants have been notified.' : 'Screenshots are blocked in this chat.');
        } catch { Alert.alert('Screenshot blocked', 'Screenshots are blocked in this chat, but participants could not be notified.'); }
      });
    }

    return () => {
      subscription?.remove();
      ScreenCapture.allowScreenCaptureAsync(protectionKey).catch(() => {});
    };
  }, [chat.id, chat.blocked]);'''
          if old not in text:
              raise SystemExit('Expected screenshot listener block was not found; refusing to modify the file.')
          path.write_text(text.replace(old, new, 1))
          PY
          cat > apps/mobile/test/screenshot-protection.test.js <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';

          test('chat screen enables native screenshot protection and releases it on unmount', async () => {
            const source = await readFile(new URL('../App.js', import.meta.url), 'utf8');
            assert.match(source, /ScreenCapture\.preventScreenCaptureAsync\(protectionKey\)/);
            assert.match(source, /ScreenCapture\.allowScreenCaptureAsync\(protectionKey\)/);
            assert.match(source, /ScreenCapture\.addScreenshotListener\(async \(\) =>/);
            assert.match(source, /platformApi\.reportScreenshot\(chat\.id\)/);
            assert.match(source, /Screenshot blocked/);
          });
          EOF
      - name: Commit screenshot protection changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/mobile/App.js apps/mobile/test/screenshot-protection.test.js
          git diff --cached --check
          git commit -m 'fix(mobile): block chat screenshots and notify participants'
          git push origin HEAD
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm verify:api
      - run: pnpm build:web
      - run: pnpm build:mobile
        env:
          EXPO_PUBLIC_API_BASE_URL: https://example.invalid/api

  php:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: cloudcomai_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pcloudcomai_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, fileinfo
      - run: find backend -name '*.php' -type f -print0 | xargs -0 -n1 php -l
      - run: php backend/tests/api_router_test.php
      - run: php backend/tests/contact_matching_test.php
      - run: php backend/tests/user_validation_test.php
      - run: php backend/tests/utf8mb4_schema_test.php
      - run: php backend/tests/privacy_messaging_test.php
        env:
          CLOUDCOMAI_RUN_DB_TESTS: '1'
          CLOUDCOMAI_TEST_DB_PASSWORD: cloudcomai_test
      - run: php backend/tests/password_recovery_test.php
        env:
          CLOUDCOMAI_RUN_DB_TESTS: '1'
          CLOUDCOMAI_TEST_DB_PASSWORD: cloudcomai_test
